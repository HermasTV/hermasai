version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install Node.js dependencies
        - npm ci --cache .npm --prefer-offline
        # Set up Python environment for PDF converter service
        - python3 -m venv pdf-converter-service/venv
        - source pdf-converter-service/venv/bin/activate
        - pip install --upgrade pip
        - pip install -r pdf-converter-service/requirements.txt
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*