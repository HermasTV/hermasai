version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install Node.js dependencies
        - npm ci --cache .npm --prefer-offline
        # Initialize git submodules (in case they're needed)
        - git submodule update --init --recursive
    build:
      commands:
        # Create test directory and dummy PDF file for pdf-parse library debug mode
        - mkdir -p test/data
        - echo "%PDF-1.4" > test/data/05-versions-space.pdf
        # Export environment variables for Next.js
        - echo "MONGODB_URI=$MONGODB_URI" >> .env.production
        - echo "PAYLOAD_SECRET=$PAYLOAD_SECRET" >> .env.production
        - echo "S3_BUCKET=$S3_BUCKET" >> .env.production
        - echo "S3_REGION=$S3_REGION" >> .env.production
        - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env.production
        - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*