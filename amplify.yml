version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install Node.js dependencies
        - npm ci --cache .npm --prefer-offline
        # Initialize git submodules (in case they're needed)
        - git submodule update --init --recursive
    build:
      commands:
        # Create test directory and dummy PDF file for pdf-parse library debug mode
        - mkdir -p test/data
        - echo "%PDF-1.4" > test/data/05-versions-space.pdf
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*