<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="micro" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- Header -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.22em">
    <text x="80" y="100" font-size="16" fill="#94a3b8" font-weight="600">CITY-SCALE TRAFFIC AI</text>
    <text x="80" y="128" font-size="12" fill="#64748b">MULTI-CAM TRACKING · SPEED · IN-CABIN · RECKLESS</text>
    <g transform="translate(1520 96)" text-anchor="end">
      <rect x="-180" y="-22" width="180" height="36" rx="8" fill="url(#brand)"/>
      <text x="-90" y="3" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0f1f" letter-spacing="0.16em">8 MODELS</text>
    </g>
  </g>

  <!-- Camera grid: 3 cols x 2 rows, total area 1440x680 starting (80, 180) -->
  <!-- Each cell ~ 460x320 with 30 gap -->
  <g transform="translate(80 180)">
    <!-- helper for one camera tile rendered manually 6 times -->

    <!-- Cam 01 (top-left) -->
    <g transform="translate(0 0)">
      <rect width="460" height="320" rx="14" fill="url(#cam)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="460" height="320" rx="14" fill="url(#micro)"/>
      <!-- horizon -->
      <line x1="0" y1="180" x2="460" y2="180" stroke="#ffffff" stroke-opacity="0.06"/>
      <!-- road perspective lines -->
      <line x1="80" y1="320" x2="220" y2="180" stroke="#ffffff" stroke-opacity="0.1"/>
      <line x1="380" y1="320" x2="240" y2="180" stroke="#ffffff" stroke-opacity="0.1"/>
      <!-- vehicles + bbox -->
      <rect x="160" y="220" width="60" height="36" rx="4" fill="#60a5fa" fill-opacity="0.3" stroke="url(#brand)" stroke-width="1.5"/>
      <rect x="240" y="240" width="78" height="48" rx="5" fill="#a78bfa" fill-opacity="0.3" stroke="url(#brand)" stroke-width="1.5"/>
      <rect x="100" y="252" width="50" height="32" rx="4" fill="#ec4899" fill-opacity="0.3" stroke="url(#brand)" stroke-width="1.5"/>
      <!-- speed labels -->
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#cbd5e1" letter-spacing="0.08em">
        <text x="190" y="214" text-anchor="middle">62 km/h</text>
        <text x="279" y="234" text-anchor="middle">48 km/h</text>
      </g>
      <!-- Cam label + ID -->
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.16em">
        <text x="14" y="22" fill="#94a3b8">CAM 01 · DOWNTOWN</text>
        <circle cx="436" cy="18" r="4" fill="#ef4444"/>
        <text x="426" y="22" text-anchor="end" fill="#cbd5e1">REC</text>
      </g>
    </g>

    <!-- Cam 02 (top-mid) -->
    <g transform="translate(490 0)">
      <rect width="460" height="320" rx="14" fill="url(#cam)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="460" height="320" rx="14" fill="url(#micro)"/>
      <line x1="0" y1="180" x2="460" y2="180" stroke="#ffffff" stroke-opacity="0.06"/>
      <line x1="100" y1="320" x2="230" y2="180" stroke="#ffffff" stroke-opacity="0.1"/>
      <line x1="360" y1="320" x2="230" y2="180" stroke="#ffffff" stroke-opacity="0.1"/>
      <!-- in-cabin bbox: face + seatbelt focus -->
      <rect x="170" y="120" width="120" height="120" rx="6" fill="none" stroke="url(#brand)" stroke-width="1.6" stroke-dasharray="6 4"/>
      <circle cx="230" cy="170" r="22" fill="#a78bfa" fill-opacity="0.35" stroke="url(#brand)" stroke-width="1.4"/>
      <line x1="210" y1="200" x2="250" y2="240" stroke="url(#brand)" stroke-width="1.6"/>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#cbd5e1" letter-spacing="0.08em">
        <text x="170" y="112">SEATBELT · 0.97</text>
        <text x="170" y="260">PHONE · NEG</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.16em">
        <text x="14" y="22" fill="#94a3b8">CAM 02 · IN-CABIN</text>
        <circle cx="436" cy="18" r="4" fill="#ef4444"/>
        <text x="426" y="22" text-anchor="end" fill="#cbd5e1">REC</text>
      </g>
    </g>

    <!-- Cam 03 (top-right) -->
    <g transform="translate(980 0)">
      <rect width="460" height="320" rx="14" fill="url(#cam)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="460" height="320" rx="14" fill="url(#micro)"/>
      <line x1="0" y1="180" x2="460" y2="180" stroke="#ffffff" stroke-opacity="0.06"/>
      <!-- tracking trails -->
      <path d="M 40 280 Q 180 240 320 200 T 440 150" fill="none" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="4 6"/>
      <path d="M 50 230 Q 200 210 340 180 T 440 110" fill="none" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="4 6"/>
      <circle cx="320" cy="200" r="6" fill="url(#brand)"/>
      <circle cx="340" cy="180" r="6" fill="url(#brand)"/>
      <!-- bbox at tip -->
      <rect x="296" y="178" width="50" height="34" rx="4" fill="none" stroke="url(#brand)" stroke-width="1.5"/>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#cbd5e1" letter-spacing="0.08em">
        <text x="296" y="170">ID #221</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.16em">
        <text x="14" y="22" fill="#94a3b8">CAM 03 · TRACK</text>
        <circle cx="436" cy="18" r="4" fill="#ef4444"/>
        <text x="426" y="22" text-anchor="end" fill="#cbd5e1">REC</text>
      </g>
    </g>

    <!-- Cam 04 (bottom-left) -->
    <g transform="translate(0 350)">
      <rect width="460" height="320" rx="14" fill="url(#cam)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="460" height="320" rx="14" fill="url(#micro)"/>
      <line x1="0" y1="200" x2="460" y2="200" stroke="#ffffff" stroke-opacity="0.06"/>
      <!-- two vehicles with speed -->
      <rect x="120" y="240" width="80" height="50" rx="5" fill="#60a5fa" fill-opacity="0.3" stroke="url(#brand)" stroke-width="1.5"/>
      <rect x="280" y="220" width="100" height="60" rx="6" fill="#ec4899" fill-opacity="0.3" stroke="url(#brand)" stroke-width="1.5"/>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#cbd5e1" letter-spacing="0.08em">
        <text x="160" y="234" text-anchor="middle">88 km/h</text>
        <text x="330" y="214" text-anchor="middle">112 km/h</text>
      </g>
      <!-- speed warn chip -->
      <g transform="translate(330 268)">
        <rect x="-30" y="-12" width="60" height="20" rx="4" fill="#ec4899"/>
        <text y="3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700" fill="#0a0f1f" letter-spacing="0.12em">OVER</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.16em">
        <text x="14" y="22" fill="#94a3b8">CAM 04 · SPEED</text>
        <circle cx="436" cy="18" r="4" fill="#ef4444"/>
        <text x="426" y="22" text-anchor="end" fill="#cbd5e1">REC</text>
      </g>
    </g>

    <!-- Cam 05 (bottom-mid) -->
    <g transform="translate(490 350)">
      <rect width="460" height="320" rx="14" fill="url(#cam)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="460" height="320" rx="14" fill="url(#micro)"/>
      <line x1="0" y1="200" x2="460" y2="200" stroke="#ffffff" stroke-opacity="0.06"/>
      <!-- pedestrians as small bboxes -->
      <g stroke="url(#brand)" stroke-width="1.4" fill="#a78bfa" fill-opacity="0.25">
        <rect x="120" y="200" width="22" height="46" rx="3"/>
        <rect x="170" y="208" width="22" height="46" rx="3"/>
        <rect x="240" y="190" width="22" height="46" rx="3"/>
        <rect x="320" y="210" width="22" height="46" rx="3"/>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#cbd5e1" letter-spacing="0.06em">
        <text x="131" y="194" text-anchor="middle">P #14</text>
        <text x="181" y="202" text-anchor="middle">P #15</text>
        <text x="251" y="184" text-anchor="middle">P #18</text>
        <text x="331" y="204" text-anchor="middle">P #20</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.16em">
        <text x="14" y="22" fill="#94a3b8">CAM 05 · PEDS</text>
        <circle cx="436" cy="18" r="4" fill="#ef4444"/>
        <text x="426" y="22" text-anchor="end" fill="#cbd5e1">REC</text>
      </g>
    </g>

    <!-- Cam 06 (bottom-right) — reckless / weaving -->
    <g transform="translate(980 350)">
      <rect width="460" height="320" rx="14" fill="url(#cam)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="460" height="320" rx="14" fill="url(#micro)"/>
      <line x1="0" y1="200" x2="460" y2="200" stroke="#ffffff" stroke-opacity="0.06"/>
      <!-- weaving trail -->
      <path d="M 40 280 Q 120 220 200 270 Q 280 320 360 240 Q 400 200 440 220" fill="none" stroke="#ec4899" stroke-width="2.4" stroke-opacity="0.85"/>
      <rect x="340" y="220" width="80" height="50" rx="5" fill="none" stroke="#ec4899" stroke-width="2"/>
      <g transform="translate(380 200)">
        <rect x="-50" y="-14" width="100" height="22" rx="4" fill="#ec4899"/>
        <text y="2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#0a0f1f" letter-spacing="0.12em">RECKLESS</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.16em">
        <text x="14" y="22" fill="#94a3b8">CAM 06 · BEHAVIOR</text>
        <circle cx="436" cy="18" r="4" fill="#ef4444"/>
        <text x="426" y="22" text-anchor="end" fill="#cbd5e1">REC</text>
      </g>
    </g>
  </g>

  <!-- Bottom telemetry -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" letter-spacing="0.18em" fill="#94a3b8">
    <text x="80" y="940">JETSON AGX · 6 STREAMS · ≤3% ACCURACY DROP</text>
    <text x="1520" y="940" text-anchor="end" fill="url(#brand)" font-weight="700">SPEED ERR &lt; 1 km/h</text>
  </g>
</svg>
